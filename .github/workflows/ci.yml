name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -e '.[dev]'
      - name: Run make check
        run: make check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -e '.[dev]'
      - name: Run the real-Docker end-to-end suite (~10 min)
        run: make e2e